# Server Configuration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-threads: 20

spring:
  application:
    name: analyzer
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 200MB
      max-request-size: 200MB
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
  data:
    redis:
      url: ${REDIS_URL}
  jackson:
    serialization:
      write-dates-as-timestamps: true
jwt:
  secret: ${JWT_SECRET}
  #expiration-ms: 86400000

springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
    health:
      show-details: always
